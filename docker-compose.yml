services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: reno
      MYSQL_USER: reno
      MYSQL_PASSWORD: reno
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ../reno-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/reno
      DB_USERNAME: reno
      DB_PASSWORD: reno
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  frontend:
    build: ../reno-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
