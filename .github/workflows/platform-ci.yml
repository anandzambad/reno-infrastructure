name: Reno Platform CI

on:
  pull_request:
    branches: [main, develop, beta, staging]
  push:
    branches: [main, develop, beta, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Helm lint
        run: |
          if find . -name Chart.yaml -print -quit | grep -q .; then
            find . -name Chart.yaml -exec dirname {} \; | xargs -r -n1 helm lint
          fi
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/kubeconform
      - name: Validate YAML manifests
        run: |
          files=$(find . -type f \( -name '*.yaml' -o -name '*.yml' \) ! -path './.git/*' | tr '\n' ' ')
          if [ -n "$files" ]; then kubeconform -strict -ignore-missing-schemas $files; fi
