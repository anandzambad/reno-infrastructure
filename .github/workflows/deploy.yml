name: Reno Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, beta, prod]
      frontend_image:
        description: Frontend immutable image tag (Git SHA)
        required: true
        type: string
      backend_image:
        description: Backend immutable image tag (Git SHA)
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with: {version: latest}
      - name: Configure kubeconfig
        env: {KUBE_CONFIG: '${{ secrets.KUBE_CONFIG }}'}
        run: |
          test -n "$KUBE_CONFIG"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Set immutable images
        run: |
          cd kubernetes/overlays/${ENVIRONMENT}
          sed -i "0,/newTag: .*/s//newTag: ${{ inputs.frontend_image }}/" kustomization.yaml
          sed -i "0,/newTag: .*/s//newTag: ${{ inputs.backend_image }}/" kustomization.yaml
      - name: Render manifests
        run: kubectl kustomize kubernetes/overlays/${ENVIRONMENT} > /tmp/reno-manifests.yaml
      - name: Apply
        run: kubectl apply -f /tmp/reno-manifests.yaml
      - name: Wait for rollout
        run: |
          kubectl -n "reno-${ENVIRONMENT}" rollout status deployment/${ENVIRONMENT}-reno-backend --timeout=180s
          kubectl -n "reno-${ENVIRONMENT}" rollout status deployment/${ENVIRONMENT}-reno-frontend --timeout=180s
