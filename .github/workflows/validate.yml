name: Infrastructure Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes overlays
        run: |
          for env in dev staging beta prod; do
            echo "Rendering ${env}"
            kubectl kustomize "kubernetes/overlays/${env}" > "/tmp/reno-${env}.yaml"
          done
