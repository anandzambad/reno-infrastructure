apiVersion: apps/v1
kind: Deployment
metadata:
  name: reno-backend
  namespace: reno
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reno-backend
  template:
    metadata:
      labels:
        app: reno-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/anandzambad/reno-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: reno-db
                  key: url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reno-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reno-db
                  key: password
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: reno-backend
  namespace: reno
spec:
  selector:
    app: reno-backend
  ports:
    - port: 8080
      targetPort: 8080
