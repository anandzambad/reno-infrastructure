apiVersion: apps/v1
kind: Deployment
metadata:
  name: reno-frontend
  namespace: reno
spec:
  replicas: 2
  selector:
    matchLabels: {app: reno-frontend}
  template:
    metadata:
      labels: {app: reno-frontend}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/anandzambad/reno-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: reno-frontend
  namespace: reno
spec:
  selector: {app: reno-frontend}
  ports: [{port: 3000, targetPort: 3000}]
